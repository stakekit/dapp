version: 1
frontend:
  phases:
    preBuild:
      commands:
        - source ./scripts/setup-mise.sh
        - pnpm install --frozen-lockfile
        - echo "VITE_API_KEY=$VITE_API_KEY" >> .env
        - echo "VITE_MIX_PANEL_TOKEN=$VITE_MIX_PANEL_TOKEN" >> .env

    build:
      commands:
        - pnpm build

  artifacts:
    baseDirectory: dist
    files:
      - "**/*"